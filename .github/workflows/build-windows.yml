name: Build Windows

on:
  push:
    branches: [main, "codex/website-club-sync"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_installer:
        description: "Buat installer pembaruan Inno juga (NSIS selalu dibuat)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tes logika (Linux, cepat)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependensi
        run: pip install -r requirements.txt
      - name: Pastikan paket yang diunggah versi terbaru
        run: |
          test -f VERSI-PAKET.txt || { echo "VERSI-PAKET.txt tidak ada: zip lama"; exit 1; }
          grep -q "tanpa-hook-nsis" VERSI-PAKET.txt || { echo "penanda paket tidak cocok: zip lama"; exit 1; }
          if [ -f desktop/build/installer-hooks.nsh ]; then echo "hook NSIS lama masih ada"; exit 1; fi
          grep -q '"include"' desktop/package.json && { echo "package.json masih memakai nsis.include"; exit 1; }
          echo "OK: paket terbaru"
      - name: Cek cepat Python polos (tanpa paket apa pun)
        run: python -S tools/verifikasi_file.py
      - name: Verifikasi kelengkapan file
        run: python tools/verifikasi_file.py
      - name: Tes logika timing & storage
        run: python tests/test_smoke.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-smoke
      - name: Tes race offline dan laporan PDF
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-contract
      - name: Periksa JavaScript produksi
        run: |
          node --check app/static/quickrace.js
          node --check app/static/sounds.js
          node --check app/static/updates.js
          node --check desktop/src/main/index.js
          node --check desktop/src/main/updates.js
      - name: Tes integrasi REST + SSE
        run: python tests/test_integration.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-int
      - name: Tes supervisor decoder + updater
        run: python tests/test_manager.py
        env:
          YURLAPS_DATA: ${{ runner.temp }}/yl-man

  # ---------------------------------------------------------------------------
  # 2. YurLapsDecoder YLP-1: dibangun dari decoder/native (tanpa OpenStint).
  # ---------------------------------------------------------------------------
  decoder:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          suppress-deprecation-warnings: msystem-ucrt64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zeromq
            mingw-w64-ucrt-x86_64-cppzmq
            mingw-w64-ucrt-x86_64-libusb
            git
            zip
      - name: Build librtlsdr Blog V4
        shell: msys2 {0}
        run: |
          set -eu
          git config --global core.autocrlf false
          rm -rf rtl-sdr-blog rtlsdr-blog-prefix
          git clone --depth 1 https://github.com/rtlsdrblog/rtl-sdr-blog.git rtl-sdr-blog
          cmake -S rtl-sdr-blog -B rtl-sdr-blog/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-std=gnu11 \
            -DINSTALL_UDEV_RULES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/rtlsdr-blog-prefix"
          cmake --build rtl-sdr-blog/build --parallel 2
          cmake --install rtl-sdr-blog/build
          test -f rtlsdr-blog-prefix/include/rtl-sdr.h
          test -f rtlsdr-blog-prefix/lib/librtlsdr.dll.a
          find rtlsdr-blog-prefix -maxdepth 3 -type f -print
      - name: Build and test YurLapsDecoder
        shell: msys2 {0}
        run: |
          set -eu
          RTL_PREFIX="$PWD/rtlsdr-blog-prefix"
          cmake -S decoder/native -B decoder/native/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYURLAPS_WITH_RTLSDR=ON -DYURLAPS_WITH_ZMQ=ON \
            -DRTLSDR_INCLUDE_DIR="$RTL_PREFIX/include" \
            -DRTLSDR_LIBRARY="$RTL_PREFIX/lib/librtlsdr.dll.a" \
            -DLIBUSB_LIBRARY=/ucrt64/lib/libusb-1.0.dll.a \
            -DZMQ_INCLUDE_DIR=/ucrt64/include \
            -DZMQ_LIBRARY=/ucrt64/lib/libzmq.dll.a
          test -f decoder/native/build/CMakeCache.txt
          echo "Resolved native decoder paths:"
          grep -E '^(RTLSDR_INCLUDE_DIR|RTLSDR_LIBRARY|LIBUSB_LIBRARY|ZMQ_INCLUDE_DIR|ZMQ_LIBRARY):' decoder/native/build/CMakeCache.txt || true
          cmake --build decoder/native/build --parallel 2 --verbose 2>&1 | tee decoder/native/build/build.log
          test ${PIPESTATUS[0]} -eq 0
          test -s decoder/native/build/YurLapsDecoder.exe
          ctest --test-dir decoder/native/build --output-on-failure
          # The freshly built executable loads librtlsdr before main() runs.
          # During this build-stage check the custom DLL is still outside
          # /ucrt64/bin, so expose its prefix explicitly.
          export PATH="$RTL_PREFIX/bin:/ucrt64/bin:$PATH"
          protocol="$(decoder/native/build/YurLapsDecoder.exe --protocol-check)" || {
            rc=$?
            echo "protocol-check failed (exit $rc): $protocol"
            exit $rc
          }
          test "$protocol" = "YURLAPS_YLP1=1"
      - name: Package decoder and licenses
        shell: msys2 {0}
        run: |
          set -eu
          out="$PWD/decoder-out"; mkdir -p "$out"
          cp decoder/native/build/YurLapsDecoder.exe "$out/"
          cp decoder/NOTICES.txt "$out/"
          rtl_matches=(rtlsdr-blog-prefix/bin/librtlsdr*.dll)
          test -e "${rtl_matches[0]}" || { echo "missing custom librtlsdr DLL"; exit 1; }
          cp "${rtl_matches[@]}" "$out/"
          copy_dll() { matches=(/ucrt64/bin/$1); test -e "${matches[0]}" || { echo "missing DLL $1"; exit 1; }; cp "${matches[@]}" "$out/"; }
          copy_dll 'libusb-1.0*.dll'
          copy_dll 'libzmq*.dll'
          copy_dll 'libsodium*.dll'
          copy_dll 'libgcc_s_seh-1.dll'
          copy_dll 'libstdc++-6.dll'
          copy_dll 'libwinpthread-1.dll'
          copy_dll 'libgcc_s_ucrt-1.dll'
      - name: Test packaged decoder
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $protocol = (& decoder-out/YurLapsDecoder.exe --protocol-check | Out-String)
          if ($LASTEXITCODE -ne 0 -or $protocol -notmatch 'YURLAPS_YLP1=1') { throw "YurLapsDecoder package failed: $protocol" }
          if (-not (Test-Path decoder-out/NOTICES.txt)) { throw "NOTICES.txt missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: yurlaps-decoder
          retention-days: 1
          path: decoder-out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Build Windows: mesin Python + jendela Electron
  # ---------------------------------------------------------------------------
  build:
    needs: [test, decoder]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deteksi folder proyek
        id: detect
        shell: pwsh
        run: |
          $root = "."
          if (Test-Path "stintlab/stintlab.spec") { $root = "stintlab" }
          "root=$root" >> $env:GITHUB_OUTPUT
          Write-Host "Folder proyek: $root"

      # Pagar anti-zip-lama: kalau yang diunggah masih paket sebelum perbaikan,
      # build dihentikan SEKARANG dengan pesan jelas, bukan gagal 90 detik
      # kemudian di tengah NSIS dengan pesan "File ... no files found".
      - name: Pastikan paket yang diunggah versi terbaru
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          if (-not (Test-Path "VERSI-PAKET.txt")) {
            throw "VERSI-PAKET.txt tidak ada: zip yang diunggah adalah paket lama. Unggah ulang ZIP sumber YurLaps versi terbaru."
          }
          $t = Get-Content "VERSI-PAKET.txt" -Raw
          if ($t -notmatch "tanpa-hook-nsis") {
            throw "Penanda paket tidak cocok: unggah ulang zip terbaru (lihat VERSI-PAKET.txt)."
          }
          if (Test-Path "desktop/build/installer-hooks.nsh") {
            throw "Masih ada desktop/build/installer-hooks.nsh: paket lama. File itu sudah dihapus di versi terbaru."
          }
          $pkg = Get-Content "desktop/package.json" -Raw
          if ($pkg -match '"include"') {
            throw "desktop/package.json masih memakai nsis.include: paket lama."
          }
          Write-Host "OK: paket terbaru (tanpa hook NSIS)"

      - name: Install dependensi Python
        working-directory: ${{ steps.detect.outputs.root }}
        run: pip install -r requirements.txt pyinstaller

      # Decoder dibangun di job "decoder" pada workflow ini juga (satu repo),
      # lalu diunduh ke vendor/decoder sebelum aplikasi dibangun.
      - name: Unduh decoder hasil job decoder
        uses: actions/download-artifact@v4
        with:
          name: yurlaps-decoder
          path: ${{ steps.detect.outputs.root }}/vendor/decoder

      - name: Pastikan decoder siap dipakai
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          # upload-artifact preserves decoder-out/ beside the source archive.
          $exe = Get-ChildItem vendor\decoder -Filter "YurLapsDecoder*" -ErrorAction SilentlyContinue
          if ($exe) {
            Write-Host "OK: memakai decoder YurLaps ($($exe[0].Name))"
            if (-not (Test-Path "vendor\decoder\NOTICES.txt")) {
              throw "NOTICES.txt tidak ada: atribusi GPL wajib ikut"
            }
          } else {
            throw "YurLapsDecoder.exe tidak ada di paket decoder"
          }

      # ---- 2a. Mesin (tanpa Tk, dipanggil jendela Electron) ----
      - name: Build mesin YurLapsEngine.exe
        working-directory: ${{ steps.detect.outputs.root }}
        run: pyinstaller --noconfirm --clean tools/engine.spec

      - name: Pastikan UI ikut di dalam mesin
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          foreach ($file in @("quickrace.html", "quickrace.js", "sounds.js", "updates.js", "assets/yurlaps-logo.png")) {
            if (-not (Test-Path "desktop\engine\_internal\app\static\$file")) {
              throw "UI web $file tidak ikut dibundel"
            }
          }
          Write-Host "OK: UI ada di dalam bundel mesin"

      - name: Uji mesin mengirim port (protokol ke Electron)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          $env:YURLAPS_DATA = "$env:RUNNER_TEMP\yl-engine"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "desktop\engine\YurLapsEngine.exe"
          $psi.Arguments = "--electron"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardInput = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $ready = $p.StandardOutput.ReadLineAsync()
          if (-not $ready.Wait(60000)) { $p.Kill(); throw "mesin tidak siap dalam 60 detik" }
          $line = $ready.Result
          Write-Host "BARIS PERTAMA:" $line
          if (-not $line -or -not $line.Contains('"event": "ready"')) {
            if (-not $p.HasExited) { $p.Kill() }
            throw "mesin tidak mengirim ready"
          }
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "mesin tidak berhenti saat stdin ditutup" }
          Write-Host "OK: mesin siap dan berhenti rapi"

      # ---- 2b. Jendela Electron ----
      - name: Install dependensi Node (Electron)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        run: npm ci

      - name: Uji jendela Electron (mesin + UI + preload)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        env:
          YURLAPS_PYTHON: python
          YURLAPS_ENGINE: ${{ github.workspace }}/${{ steps.detect.outputs.root }}/desktop/engine/YurLapsEngine.exe
        run: npx electron test/smoke.js

      # ---- 2c. Installer Inno (jalur pembaruan /UPDATEZIP) ----
      # Install Inno sebelum electron-builder; kompilasi dilakukan setelah
      # win-unpacked tersedia agar installer pembaruan berisi aplikasi lengkap.
      - name: Install Inno Setup
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Siapkan folder dist untuk Inno
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist\YurLaps | Out-Null

      - name: Build installer Electron (NSIS + portable)
        working-directory: ${{ steps.detect.outputs.root }}/desktop
        run: npm run dist

      - name: Siapkan aplikasi untuk installer pembaruan (Inno)
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          # dist\YurLaps hanya berisi APLIKASI (bukan installer) supaya
          # installer tidak memungut dirinya sendiri. Hasil Inno ditulis ke
          # dist\ dengan nama YurLaps-Setup-<versi>-full.exe.
          New-Item -ItemType Directory -Force dist\YurLaps | Out-Null
          Copy-Item dist-electron\win-unpacked\* dist\YurLaps\ -Recurse -Force
          Remove-Item dist\YurLaps\*.exe -Exclude "YurLaps.exe" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "dist\YurLaps\YurLaps.exe")) { throw "dist\YurLaps\YurLaps.exe tidak ada" }

      - name: Build installer Inno (YurLaps-Setup untuk pembaruan)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_installer }}
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\stintlab.iss
          if (-not (Test-Path "dist\YurLaps-Setup-*.exe")) { throw "installer Inno gagal" }

      - name: Siapkan manifest pembaruan (update.json)
        working-directory: ${{ steps.detect.outputs.root }}
        run: python tools/buat_update_manifest.py --dir dist-electron

      - name: Publikasikan rilis ke website YurLaps
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        env:
          YURLAPS_SUPABASE_URL: ${{ secrets.YURLAPS_SUPABASE_URL }}
          YURLAPS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.YURLAPS_SUPABASE_SERVICE_ROLE_KEY }}
          YURLAPS_RELEASE_BUCKET: yurlaps-releases
          YURLAPS_RELEASE_DIR: dist-electron
          YURLAPS_RELEASE_VERSION: ${{ github.ref_name }}
          YURLAPS_RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          $env:YURLAPS_RELEASE_VERSION = $env:YURLAPS_RELEASE_VERSION.TrimStart('v')
          node tools/publish_release.mjs

      - name: Ringkasan artefak
        working-directory: ${{ steps.detect.outputs.root }}
        shell: pwsh
        run: |
          Write-Host "=== INSTALLER UTAMA (pakai ini) ==="
          Get-ChildItem dist-electron -Include *.exe,*.zip -Recurse -Depth 0 |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Write-Host ""
          Write-Host "=== ALAT PEMBARUAN (bukan untuk dipasang manual) ==="
          Get-ChildItem dist -Filter *-full.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Write-Host ""
          Write-Host "update.json:"
          Get-ChildItem dist -Filter *.json | Select-Object Name

      - uses: actions/upload-artifact@v4
        with:
          name: YurLaps-Windows
          retention-days: 3
          path: |
            ${{ steps.detect.outputs.root }}/dist-electron/*.exe
            ${{ steps.detect.outputs.root }}/dist-electron/*.zip
            ${{ steps.detect.outputs.root }}/dist-electron/*.yml
            ${{ steps.detect.outputs.root }}/dist/*-full.exe
            ${{ steps.detect.outputs.root }}/dist/*.json
            ${{ steps.detect.outputs.root }}/vendor/decoder/yurlaps-decoder-src.zip
            ${{ steps.detect.outputs.root }}/vendor/decoder/upstream-commit.txt
          if-no-files-found: error

